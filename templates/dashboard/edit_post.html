{% extends "base.html" %}
{% block content %}
{% load crispy_forms_tags%}
<div class="row">
  {% comment %} Left sidebar {% endcomment %}
  {% include "dashboard/sidebar.html" %} {% comment %} Right sidebar {% endcomment %}
  <div class="col-md-9">
    <h1>Edit Blog Post</h1>
    <form action="{% url "edit_post" post.id %}" method="POST" enctype="multipart/form-data">
        {% csrf_token%}
        {{form | crispy}}
        <button class="btn btn-warning text-dark">Submit</button>
    </form>
  </div>
</div>
{% endblock content %}

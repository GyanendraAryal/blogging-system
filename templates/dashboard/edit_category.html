{% extends "base.html" %}
{% block content %}
{% load crispy_forms_tags%}
<div class="row">
  {% comment %} Left sidebar {% endcomment %}
  {% include "dashboard/sidebar.html" %} {% comment %} Right sidebar {% endcomment %}
  <div class="col-md-9">
    <h1>Edit Category</h1>
    <form action="{% url "edit_category" category.id %}"  method="POST" style="width: 500px;">
        {% csrf_token%}
        {{form | crispy}}
        <button class="btn btn-warning text-dark">Save</button>
    </form>
  </div>
</div>
{% endblock content %}
